naftiko: 1.0.0-alpha2
info:
  label: Rutter Unified API — Ads
  description: 'Rutter Unified API — Ads. 1 operations. Lead operation: List Ad Accounts. Self-contained Naftiko capability
    covering one Rutter business surface.'
  tags:
  - Rutter
  - Ads
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RUTTER_API_KEY: RUTTER_API_KEY
capability:
  consumes:
  - type: http
    namespace: unified-ads
    baseUri: https://production.rutterapi.com/versioned
    description: Rutter Unified API — Ads business capability. Self-contained, no shared references.
    resources:
    - name: ad-accounts
      path: /ad-accounts
      operations:
      - name: listadaccounts
        method: GET
        description: List Ad Accounts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.RUTTER_USER}}'
      password: '{{env.RUTTER_PASS}}'
  exposes:
  - type: rest
    namespace: unified-ads-rest
    port: 8080
    description: REST adapter for Rutter Unified API — Ads. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/ad-accounts
      name: ad-accounts
      description: REST surface for ad-accounts.
      operations:
      - method: GET
        name: listadaccounts
        description: List Ad Accounts
        call: unified-ads.listadaccounts
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: unified-ads-mcp
    port: 9090
    transport: http
    description: MCP adapter for Rutter Unified API — Ads. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-ad-accounts
      description: List Ad Accounts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: unified-ads.listadaccounts
      outputParameters:
      - type: object
        mapping: $.
