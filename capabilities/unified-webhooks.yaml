naftiko: 1.0.0-alpha2
info:
  label: Rutter Unified API — Webhooks
  description: 'Rutter Unified API — Webhooks. 3 operations. Lead operation: List Webhooks. Self-contained Naftiko capability
    covering one Rutter business surface.'
  tags:
  - Rutter
  - Webhooks
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RUTTER_API_KEY: RUTTER_API_KEY
capability:
  consumes:
  - type: http
    namespace: unified-webhooks
    baseUri: https://production.rutterapi.com/versioned
    description: Rutter Unified API — Webhooks business capability. Self-contained, no shared references.
    resources:
    - name: config-webhooks
      path: /config-webhooks
      operations:
      - name: listwebhooks
        method: GET
        description: List Webhooks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createwebhook
        method: POST
        description: Create Webhook
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: config-webhooks-webhookId
      path: /config-webhooks/{webhookId}
      operations:
      - name: deletewebhook
        method: DELETE
        description: Delete Webhook
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: webhookId
          in: path
          type: string
          required: true
    authentication:
      type: basic
      username: '{{env.RUTTER_USER}}'
      password: '{{env.RUTTER_PASS}}'
  exposes:
  - type: rest
    namespace: unified-webhooks-rest
    port: 8080
    description: REST adapter for Rutter Unified API — Webhooks. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/config-webhooks
      name: config-webhooks
      description: REST surface for config-webhooks.
      operations:
      - method: GET
        name: listwebhooks
        description: List Webhooks
        call: unified-webhooks.listwebhooks
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createwebhook
        description: Create Webhook
        call: unified-webhooks.createwebhook
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/config-webhooks/{webhookid}
      name: config-webhooks-webhookid
      description: REST surface for config-webhooks-webhookId.
      operations:
      - method: DELETE
        name: deletewebhook
        description: Delete Webhook
        call: unified-webhooks.deletewebhook
        with:
          webhookId: rest.webhookId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: unified-webhooks-mcp
    port: 9090
    transport: http
    description: MCP adapter for Rutter Unified API — Webhooks. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-webhooks
      description: List Webhooks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: unified-webhooks.listwebhooks
      outputParameters:
      - type: object
        mapping: $.
    - name: create-webhook
      description: Create Webhook
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: unified-webhooks.createwebhook
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-webhook
      description: Delete Webhook
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: unified-webhooks.deletewebhook
      with:
        webhookId: tools.webhookId
      outputParameters:
      - type: object
        mapping: $.
